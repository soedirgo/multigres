name: Docker Build and Publish (supabase-postgres)

on:
  workflow_dispatch:
    inputs:
      supabase_postgres_tag:
        description: 'Supabase Postgres base tag override (e.g. 17.6.1.173). Empty = read from supabase/Dockerfile.'
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/docker-build-supabase-postgres.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker-supabase-postgres:
    name: Build and Push supabase-postgres Docker Image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Resolve supabase/postgres base tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.supabase_postgres_tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag=$(grep -oE '^ARG[[:space:]]+SUPABASE_POSTGRES_TAG=[^[:space:]]+' supabase/Dockerfile | cut -d= -f2)
          fi
          [[ "$tag" =~ ^17\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::supabase/Dockerfile must declare 'ARG SUPABASE_POSTGRES_TAG=X.Y.Z.N' (got '$tag')"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve pgbackrest version from Dockerfile
        id: pgbackrest
        run: |
          version=$(grep -oE '^ARG[[:space:]]+PGBACKREST_VERSION=[^[:space:]]+' Dockerfile | cut -d= -f2)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Dockerfile must declare 'ARG PGBACKREST_VERSION=X.Y.Z' (got '$version')"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        env:
          BASE_TAG: ${{ steps.resolve.outputs.tag }}
        with:
          images: ghcr.io/${{ github.repository_owner }}/supabase-postgres
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ env.BASE_TAG }}-sha-${{ github.sha }},enable={{is_default_branch}}
            type=raw,value=${{ env.BASE_TAG }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.base-name=supabase/postgres:${{ env.BASE_TAG }}

      - name: Read Go version from go.mod
        id: goversion
        uses: ./.github/actions/go-version

      - name: Read commit date
        id: commitdate
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push supabase-postgres Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./supabase/Dockerfile
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            COMMIT_DATE=${{ steps.commitdate.outputs.date }}
            SUPABASE_POSTGRES_TAG=${{ steps.resolve.outputs.tag }}
            PGBACKREST_VERSION=${{ steps.pgbackrest.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
